# Po wypchnieciu taga (np. 1.2.1) GitHub sam pakuje addon i wysyla go na CurseForge
# oraz tworzy GitHub Release. Wymaga sekretu CF_API_KEY i "## X-Curse-Project-ID" w pliku .toc.
name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
